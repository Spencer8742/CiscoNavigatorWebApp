name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs write access.
permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Integration tests: a real backend process against a mock Home
      # Assistant speaking the real protocol. This is the job that matters —
      # the compressed-diff handling is where a silent regression would
      # otherwise reach a wall-mounted panel before anyone noticed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          APP_VERSION: ci-${{ github.sha }}

      # A self-imposed budget, NOT a device limit -- worth being exact about,
      # because the previous comment here claimed otherwise and the number
      # then got treated as a hardware ceiling it never was.
      #
      # What Cisco actually documents (quoted in docs/ROOMOS.md §2) is a
      # RUNTIME MEMORY constraint: the web engine is "restricted, both in
      # memory and CPU usage", and a page that exceeds it is TERMINATED. They
      # publish no figure, and nothing they publish constrains bundle size.
      # The two are different axes and, here, three orders of magnitude apart
      # -- this bundle is ~50 KB gzipped against a device with 4 GB of RAM.
      #
      # So this gate does not protect against the documented failure mode.
      # What it does is make weight a deliberate decision: pulling in a date
      # library or a chart package should be a conversation, not a diff
      # nobody notices. The budget is set well above current usage for that
      # reason -- it should catch a step change, not tax ordinary work.
      #
      # The constraint that DOES map to the real failure mode is the heap,
      # and the only place it can honestly be measured is the device. The
      # panel reports it in Settings -> Device for exactly that reason.
      - name: Enforce bundle budget
        run: |
          set -euo pipefail

          JS_BUDGET=122880  # 120 KB gzipped
          CSS_BUDGET=24576  # 24 KB gzipped
          WARN_PCT=80       # report early, so growth is visible before it fails

          js=$(cat panel/dist/a/*.js | gzip -9 | wc -c)
          css=$(cat panel/dist/a/*.css | gzip -9 | wc -c)

          report() {
            name=$1; used=$2; budget=$3
            pct=$(( used * 100 / budget ))
            printf '%-4s %6d bytes gzipped  %3d%% of %d\n' "$name" "$used" "$pct" "$budget"
            if [ "$used" -gt "$budget" ]; then
              echo "::error::$name bundle over budget ($used > $budget)"
              return 1
            fi
            if [ "$pct" -ge "$WARN_PCT" ]; then
              echo "::warning::$name bundle at ${pct}% of budget -- worth a look before it fails"
            fi
            return 0
          }

          fail=0
          report JS  "$js"  "$JS_BUDGET"  || fail=1
          report CSS "$css" "$CSS_BUDGET" || fail=1
          exit "$fail"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — publishing happens in publish.yml on main. This exists so
      # a Dockerfile change that breaks the image is caught on the PR rather
      # than after merge, when the next deploy would fail.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: navigator-panel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that builds but exits on startup is not a passing build.
      - name: Smoke test the container
        run: |
          set -euo pipefail

          docker run -d --name smoke -p 18099:8099 \
            -e PANEL_TOKEN=ci-smoke-token \
            navigator-panel:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18099/api/health > /dev/null 2>&1; then
              echo "Container is healthy after ${i}s"

              echo "--- health ---"
              curl -fsS http://127.0.0.1:18099/api/health

              echo "--- the panel shell is served ---"
              curl -fsS http://127.0.0.1:18099/ | head -c 120

              echo ""
              echo "--- an unauthenticated API call is refused ---"
              code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18099/api/config)
              [ "$code" = "401" ] || { echo "::error::expected 401, got $code"; exit 1; }

              echo "--- the default config was seeded into /config ---"
              docker exec smoke test -f /config/dashboard.yaml \
                || { echo "::error::config was not seeded"; exit 1; }

              # NOTE: `docker exec ... id -u` would report the IMAGE's user,
              # which is root — the entrypoint needs it to fix appdata
              # ownership. What matters is the uid the node process ended up
              # running as after su-exec, so read it out of /proc.
              #
              # Matched on the process NAME (pgrep -x), not on a cmdline
              # substring: grepping cmdline for "dist/server.js" also matches
              # any shell whose own command line happens to contain that text,
              # which silently reports the wrong uid.
              echo "--- the node process dropped privileges ---"
              uid=$(docker exec smoke sh -c '
                pid=$(pgrep -x node 2>/dev/null | head -n 1)
                [ -n "$pid" ] || exit 1
                awk "/^Uid:/ { print \$2; exit }" "/proc/$pid/status"
              ') || { echo "::error::could not find the server process"; exit 1; }

              echo "server process uid: $uid"
              [ "$uid" != "0" ] || { echo "::error::server is running as root"; exit 1; }
              [ "$uid" = "1000" ] || { echo "::error::expected default uid 1000, got $uid"; exit 1; }

              docker rm -f smoke > /dev/null
              exit 0
            fi
            sleep 1
          done

          echo "::error::Container did not become healthy"
          docker logs smoke
          docker rm -f smoke > /dev/null
          exit 1

  android:
    name: Android wrapper builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build matching panel client
        run: npm ci && npm run build --workspace panel
        env:
          APP_VERSION: echo-${{ github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Download wake word model assets
        working-directory: android/echo-panel/app/src/main/assets
        run: |
          curl -fsSLO https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/melspectrogram.onnx
          curl -fsSLO https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/embedding_model.onnx
          curl -fsSLO https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/hey_jarvis_v0.1.onnx
          shasum -a 256 -c <<'EOF'
          ba2b0e0f8b7b875369a2c89cb13360ff53bac436f2895cced9f479fa65eb176f  melspectrogram.onnx
          70d164290c1d095d1d4ee149bc5e00543250a7316b59f31d056cff7bd3075c1f  embedding_model.onnx
          94a13cfe60075b132f6a472e7e462e8123ee70861bc3fb58434a73712ee0d2cb  hey_jarvis_v0.1.onnx
          EOF

      - name: Build debug APK
        run: gradle -p android/echo-panel assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: echo-panel-debug-apk
          path: android/echo-panel/app/build/outputs/apk/debug/app-debug.apk
