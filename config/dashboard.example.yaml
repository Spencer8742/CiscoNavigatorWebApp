# ───────────────────────────────────────────────────────────────────────────
#  Cisco Navigator Panel — dashboard configuration
#
#  Copy to config/dashboard.yaml and edit. This file is the ONLY place you
#  name Home Assistant entities. No entity ID appears anywhere in the UI code.
#
#  Hot-reloaded: save the file and connected panels update within a second.
#  If the file has a syntax error the server keeps running the last good
#  config and logs the problem — a typo never takes the panel down.
#
#  This file is also a security allow-list. The backend refuses to call a
#  service against any entity not named here, so a tampered panel cannot
#  reach entities you never put on the dashboard.
# ───────────────────────────────────────────────────────────────────────────

version: 1

# ─── Panel appearance and behaviour ────────────────────────────────────────
ui:
  # Panel title, shown in Settings and used as the document title.
  title: Home

  # left | bottom
  #
  # 'left' is the default and the recommendation for a 10.1" 16:10 Navigator:
  # a vertical rail costs ~7% of the width, whereas a bottom bar costs ~12% of
  # the (scarcer) height, and the rail does not move when the soft keyboard
  # appears. Switch to 'bottom' if you prefer thumb reach on a table stand.
  navPosition: left

  # 24h | 12h
  clock: 24h

  # Used for sunrise/sunset shading and date formatting. IANA name.
  timezone: Europe/London

  # BCP-47 tag for number/date formatting.
  locale: en-GB

  # backdrop-filter blur on sheets and overlays.
  #
  # Cisco's own guidance is to reduce layers with opacity and avoid drop
  # shadows; blur is the same class of GPU cost on a device that is also
  # running a video pipeline. OFF by default. Turn it on, then verify frame
  # rate on the actual device before keeping it.
  blur: false

  # Global animation scale. 1 = normal, 0 = disable all motion.
  # Drop to 0.6 if you find animation costly on your specific device.
  motion: 1

  # Accent colour. Plain hex only — Chromium 102 has no oklch()/color-mix().
  accent: "#5B9DFF"


# ─── Idle / screensaver behaviour ──────────────────────────────────────────
idle:
  # Seconds of no touch before the photo screensaver takes over. 0 disables.
  timeoutSeconds: 180

  # Seconds of no touch before returning to the Home screen from any other
  # screen (happens before the screensaver). 0 disables.
  returnHomeSeconds: 90

  # How long the CONTROLS screen holds both of the above off. 0 disables the
  # hold, so Controls idles like every other screen.
  #
  # Controls is the one screen that is doing its job while nobody touches it:
  # you are in a call, hang up and mute are on screen, and going to photos
  # after three minutes is the panel being wrong about what it is for.
  #
  # Note this holds the return to Home as well, not just the screensaver.
  # With the defaults above, returnHomeSeconds (90) is well short of
  # timeoutSeconds (180), so holding only the screensaver would change
  # nothing you could see — the panel would leave Controls at 90s and
  # screensave from Home at 180s.
  #
  # It expires rather than lasting forever because the panel has no way to
  # know when you are done: RoomOS gives a web page no call state, and a panel
  # parked on a static grid of keys indefinitely risks burn-in and never shows
  # a photo again. Raise it if your meetings run long.
  controlsHoldSeconds: 1800

  # What the screensaver shows overlaid on the photos.
  overlays:
    clock: true
    date: true
    weather: true
    nowPlaying: true
    # Photo date and location from EXIF.
    photoInfo: true

  # Overlay elements drift slowly and reposition on each photo change to
  # avoid burn-in on a permanently mounted panel.
  burnInProtection: true


# ─── Immich ────────────────────────────────────────────────────────────────
# Credentials live in .env — this section only chooses WHAT to show.
immich:
  enabled: true

  # Seconds each photo is displayed.
  intervalSeconds: 45

  # Crossfade duration in milliseconds.
  transitionMs: 1200

  # Which photos feed the slideshow. Sources are combined.
  sources:
    # Random from the whole library.
    - type: random

    # Only favorites.
    # - type: favorites

    # Specific albums. Get the ID from the Immich album URL:
    #   https://immich.your.lan/albums/<THIS-PART>
    # - type: album
    #   id: 6f1c0b2e-1234-4a5b-9c8d-0e1f2a3b4c5d
    #   name: Holidays

    # The most recent N photos.
    # - type: recent
    #   days: 90

  # Restrict to photos, not videos. Recommended: video decoding competes with
  # the device's own video pipeline.
  imagesOnly: true

  # Show two portrait photos side by side instead of one in the middle with
  # empty bars either side. A portrait uses about a third of a 16:9 panel;
  # this fills the rest with a second photo rather than background.
  # Landscape photos are never paired — they already fill the screen.
  pairPortraits: true

  # How often the Home screen's photo card changes, in seconds.
  # Set to 0 to hold one photo until you leave the screen.
  # Separate from intervalSeconds above: 45s is right for a fullscreen
  # slideshow and restless for a card you glance past.
  homeCardSeconds: 15

  # Don't show photos older than this many years. Omit for no limit.
  # maxAgeYears: 10


# ─── Rooms ─────────────────────────────────────────────────────────────────
# Each room becomes a card on the Rooms screen. Entities are grouped by
# domain automatically; the control shown adapts to the entity type.
#
# ── Naming ────────────────────────────────────────────────────────────────
# Anywhere entities are listed (rooms, favorites, scenes) you can write EITHER
# a bare entity id, which uses Home Assistant's own friendly_name:
#
#     - light.kitchen_ceiling
#
# ...OR an object with a display name that overrides it:
#
#     - entity: light.kitchen_under_cabinet
#       name: Under Cabinet
#
# Use the override when HA's name is too long for a tile. "Living Room
# Ceiling Light Bulb 3" is accurate and unreadable on a small card; "Ceiling"
# is what you actually want to see. Mix both freely in the same list.
rooms:
  - id: living_room
    name: Living Room
    # Icon name from panel/src/components/Icon — see that file for the list.
    icon: sofa
    entities:
      # Bare id: whatever Home Assistant calls it.
      - light.living_room_ceiling

      # With an override, for when HA's name is unhelpfully long.
      - entity: light.living_room_lamps
        name: Lamps
      - entity: switch.living_room_tv_power
        name: TV

      - cover.living_room_blinds
      - climate.living_room
      - sensor.living_room_temperature
      - binary_sensor.living_room_motion
      - media_player.living_room_speaker

  - id: kitchen
    name: Kitchen
    icon: kitchen
    entities:
      - light.kitchen_ceiling
      - light.kitchen_under_cabinet
      - switch.kettle
      - sensor.kitchen_temperature

  - id: bedroom
    name: Bedroom
    icon: bed
    entities:
      - light.bedroom
      - cover.bedroom_curtains
      - climate.bedroom
      - fan.bedroom_ceiling_fan
      - sensor.bedroom_temperature
      - sensor.bedroom_humidity

  - id: outside
    name: Outside
    icon: tree
    entities:
      - light.porch
      - lock.front_door
      - binary_sensor.front_door
      - sensor.outdoor_temperature


# ─── Home screen ───────────────────────────────────────────────────────────
home:
  # Big tiles at the top. Anything controllable can go here.
  # Bare id or { entity:, name: } — see the note above the rooms section.
  favorites:
    - entity: light.living_room_ceiling
      name: Living Room
    - entity: light.kitchen_ceiling
      name: Kitchen
    - switch.kettle
    - lock.front_door
    - cover.living_room_blinds

  # One-tap scenes and scripts.
  scenes:
    - scene.movie_night
    - scene.good_morning
    - entity: scene.all_off
      name: Everything Off
    - script.goodnight

  # Small readouts in the status strip.
  # `label:` and `name:` both work here.
  status:
    - entity: sensor.living_room_temperature
      label: Indoor
    - entity: sensor.outdoor_temperature
      label: Outdoor
    - entity: sensor.house_power
      label: Power
    - entity: binary_sensor.front_door
      label: Front Door

  # Weather entity for the home screen and screensaver overlay.
  weather: weather.home

  # Entities that should raise an alert on the home screen when they are in
  # the given state. Keeps "is the house safe" answerable at a glance.
  alerts:
    - entity: lock.front_door
      when: unlocked
      label: Front door unlocked
    - entity: binary_sensor.garage_door
      when: "on"
      label: Garage open
    - entity: binary_sensor.washing_machine_finished
      when: "on"
      label: Washing machine finished


# ─── Media players ─────────────────────────────────────────────────────────
#
# Speakers, the queue and the whole library come from Music Assistant
# DIRECTLY — set MASS_URL and MASS_TOKEN in your .env and there is nothing to
# configure here. Players are discovered, groups are whatever Music Assistant
# says they are, and Browse offers Recent, Favorites, Albums, Artists,
# Playlists, Radio and Search with no library copied into this file.
media:
  # Headings for the player list, in order. Which speaker goes under which
  # heading is chosen by tapping Organize on the Media screen and is stored in
  # panel-prefs.json — naming needs a keyboard, filing does not.
  sections:
    - Downstairs
    - Upstairs
    - Outside
    - TVs

  # Optional, and only a RENAME. Identity comes from Music Assistant, so there
  # is nothing to keep in sync — an entry here just relabels a speaker whose
  # Music Assistant name you do not like. Match by Music Assistant player id
  # or by its current name.
  players:
    - entity: kitchen_speaker
      name: Kitchen

  # Which player to show first. 'active' picks whichever is currently playing,
  # falling back to the first in the list. Or name an entity_id.
  default: active

  # Volume step for the +/- buttons, as a fraction (0.05 = 5%).
  volumeStep: 0.05

# ─── How the controls behave ───────────────────────────────────────────────
#
#  Tap a tile           does the obvious thing:
#                         lights, switches, fans  → toggle
#                         scenes, scripts         → activate
#                         everything else         → open the detail sheet
#  Long-press a tile    opens the detail sheet (brightness, colour, position,
#                       setpoints, lock/unlock). Tiles with a sheet behind a
#                       long-press show a small "..." hint.
#
#  Which controls appear is decided by what the entity reports, not by this
#  file: a non-dimmable light shows no brightness slider, a blind with no
#  position feedback shows only open/stop/close.


# ─── Google Nest Hub displays (cast mode) ──────────────────────────────────
# A Nest Hub has no browser, so the only way onto its screen is to cast a page
# to it — and a cast page is a display, not a control panel. Cast mode is
# therefore a separate, read-only view: a few big panes that rotate on their
# own, sized to be read from across a room.
#
# List your displays below and the backend casts them itself, and keeps them
# cast: a Hub loses whatever it was showing on every reboot, timer and voice
# answer, so something has to notice and put it back. Nothing else to install.
#
# See docs/DEPLOYMENT.md §3a for the honest limits — touch is not guaranteed,
# and the Hub still takes its screen back for timers and voice.
cast:
  # How a Hub reaches this dashboard: scheme, host, port, no path.
  #
  # This cannot be worked out for you. `localhost` is the container, and a
  # .local name is resolved by a Nest Hub through Google rather than over your
  # LAN — so it has to be the LAN address of the machine running this.
  #
  # Leave it empty and the backend never casts anything.
  baseUrl: ''

  # The displays to keep the dashboard on.
  #
  # Use IP ADDRESSES, not names. Cast devices are normally found by name over
  # mDNS, and mDNS does not cross a Docker bridge network; an address needs no
  # discovery at all. Give each Hub a DHCP reservation while you are there.
  #
  # `pane:` is optional and may be dashboard | clock | status | media | photos.
  # `dashboard` is the FULL interactive UI rather than the panes below — touch
  # works on a Nest Hub, so that is a real control panel. Use it where you
  # actually touch things and the panes where you only glance.
  displays: []
  #  - host: 192.168.1.42
  #    name: Kitchen
  #    pane: dashboard
  #  - host: 192.168.1.43
  #    name: Hallway
  #    pane: clock
  #  - 192.168.1.44          # bare address: uses the rotation below

  # Seconds between checks. 0 turns the keeper off without deleting the list.
  #
  # A display already showing the dashboard is left alone, so this costs one
  # short connection per display and never causes a visible reload.
  checkSeconds: 300

  # Let a `pane: dashboard` display fall into the photo screensaver when it has
  # been idle for idle.timeoutSeconds, exactly as the Navigator does. A touch
  # brings the dashboard back.
  #
  # Set false if a Hub is your wall control panel and you want it to always be
  # one. The panes below are unaffected either way — `photos` is already a
  # slideshow.
  screensaver: true

  # In order. clock | status | media | photos
  panes:
    - clock
    - media
    - photos

  # Seconds each pane holds. 0 pins the first one and never rotates.
  rotateSeconds: 30

  # Jump to Now Playing the moment music starts, and stay there. A display in
  # the kitchen showing the weather while someone is choosing an album is
  # showing the wrong thing.
  followMusic: true

  # Play a silent loop to hold the cast session open.
  #
  # OFF by default. It takes the device's audio focus, so on a Nest Hub that
  # is ALSO a Music Assistant speaker it may interrupt playback on that
  # speaker. Only turn it on if the session is being dropped without it.
  audioKeepAlive: false


# ─── Controls: the macro pages ─────────────────────────────────────────────
#
# This section replaces a RoomOS macro.
#
# A Room Bar with a paired Navigator used to run `companion_bridge.js`, a
# JavaScript macro that mapped UI Extension widget taps onto HTTP calls:
# Bitfocus Companion button presses, Home Assistant webhooks, and Elgato Key
# Lights. All of it — the macro, the panel XML, the HttpClient config — lived
# ON THE DEVICE, and a factory reset destroyed it with no single artefact to
# put back.
#
# So the buttons live here now. The device holds one URL (see
# scripts/provision-roombar.sh) and everything else is this file. A factory
# reset costs one script run.
#
# What the buttons can reach, and how:
#
#   companion:  a Bitfocus Companion button, by its grid location.
#               Needs COMPANION_URL in .env.
#   webhook:    a Home Assistant webhook — POST /api/webhook/<id>.
#               Uses HA_URL; no extra credentials, the id is the secret.
#   entity:     an ordinary Home Assistant service call, exactly as a tile
#               makes. Subject to the same allow-list as everything else in
#               this file.
#   keylight:   an Elgato Key Light, listed under `keylights:` below.
#   light:      not a button — the FULL key light control, with power,
#               brightness and colour temperature.
#
# The panel never sends a URL, a Companion coordinate or a webhook id. It
# sends the button's id and the backend looks it up here, for the same reason
# service calls are checked against the entity list above: a screen on a wall
# is trusted to drive the dashboard, not to compose requests to your LAN.
controls:
  # Elgato Key Lights, by address.
  #
  # Use IP ADDRESSES with a DHCP reservation, not .local names — the same
  # mDNS-across-a-bridge-network problem as cast displays. Port defaults to
  # 9123 and there is no such thing as an authenticated Key Light, which is
  # exactly why these are driven from the backend: an HTTPS page cannot fetch
  # http://192.168.1.201 (RoomOS blocks mixed content), and the lights send no
  # CORS headers even if it could.
  keylights: []
  #  - id: key_left
  #    name: Key Left
  #    host: 192.168.1.201
  #  - id: key_right
  #    name: Key Right
  #    host: 192.168.1.148

  # Seconds between key light state polls. 0 stops polling.
  #
  # Elgato lights push nothing, so this is the only way to notice one that was
  # switched off at the light itself. Commands from the panel adopt the
  # light's own reply, so this is not what makes the sliders feel responsive.
  # Polling pauses entirely while no panel is connected.
  pollSeconds: 15

  # The pages. Each is a tab on the Controls screen.
  pages: []
  #  - id: deskpro
  #    name: Desk Pro
  #    icon: phone
  #    # Keys across. Omit (or 0) to fit as many as the panel holds.
  #    #
  #    # Worth setting whenever the keys come in pairs. Auto-fitting packs as
  #    # many 8rem keys per row as fit and wraps wherever it runs out — on an
  #    # eight-key page that left seven on one row and one stranded below, and
  #    # put Camera Off beside Vol +, which have nothing to do with each other.
  #    # Naming the count puts the wrap where the meaning is.
  #    columns: 4
  #    # md | lg. `lg` roughly doubles the key height. A page of eight keys has
  #    # room to spare on a 10.1" panel, and a bigger target is a better target
  #    # on a screen someone stabs at mid-call without looking straight at it.
  #    size: lg
  #    items:
  #      # Companion, written the way a config export shows it: page/row/column.
  #      # {page: 1, row: 0, column: 0} and [1, 0, 0] are also accepted.
  #      #
  #      # These coordinates are Companion's own and they MOVE when you
  #      # rearrange a Companion page. Re-derive them from a fresh Companion
  #      # config export rather than from memory.
  #      - name: Join
  #        icon: phone
  #        tone: accent
  #        wide: true          # spans two columns
  #        companion: 1/0/0
  #      - name: Hang Up
  #        icon: phoneDown
  #        tone: danger        # outlined, not filled — see screens.css
  #        companion: 1/0/1
  #      - name: Mute
  #        icon: micOff
  #        companion: 1/1/0
  #      - name: Share
  #        icon: share
  #        companion: 1/1/1
  #
  #  - id: lights
  #    name: Lights
  #    icon: bulb
  #    items:
  #      # A button that drives the key lights. op is one of
  #      # toggle | on | off | brightness | temperature.
  #      - name: Key Lights
  #        icon: power
  #        keylight: { light: all, op: toggle }
  #      - name: Full
  #        icon: sun
  #        keylight: { light: all, op: brightness, value: 100 }
  #      - name: Dim
  #        icon: bulb
  #        keylight: { light: all, op: brightness, value: 20 }
  #      # An ordinary Home Assistant entity. Scenes and scripts need no
  #      # `service:` — turn_on is assumed.
  #      - name: Office Off
  #        icon: power
  #        tone: danger
  #        entity: scene.office_off
  #      # `light:` on its own is the full control: power, brightness, colour
  #      # temperature, with live state. `all` addresses every light above as
  #      # one, so a pair either side of a desk cannot drift apart.
  #      - light: all
  #        name: Key Lights
  #
  #  - id: scenes
  #    name: Scenes
  #    icon: scene
  #    items:
  #      - name: Meeting
  #        entity: scene.office_meeting
  #      - name: Movie Night
  #        entity: scene.movie_night
  #      # A Home Assistant webhook. This is what the old macro's page-less
  #      # `voice_pe` action button did.
  #      #
  #      # Home Assistant answers 200 for a webhook that does not exist, on
  #      # purpose, so a button that appears to do nothing is a missing
  #      # automation rather than a broken panel.
  #      - name: Listen
  #        icon: mic
  #        webhook: office_voice_listen
  #
  #  # ── A media player's inputs, as a picker ───────────────────────────────
  #  #
  #  # `sources:` makes a key a PICKER rather than a button: it opens a sheet
  #  # of that media player's inputs, and choosing one calls select_source.
  #  #
  #  # `inputs:` curates and renames. Without it the sheet offers whatever the
  #  # device reports — every HDMI plus Live TV and every streaming app — when
  #  # the question is only ever "which box am I looking at". And it names them
  #  # for the cable rather than the room: "HDMI 3" is only meaningful if you
  #  # remember what is plugged into it.
  #  #
  #  # A curated list also becomes the allow-list, which is stronger than the
  #  # device's because it is written down: the picker still works while the TV
  #  # is OFF and source_list is empty, which is exactly when you reach for it.
  #  #
  #  # Bare string or {source, name}, mixed freely, same as an entity list.
  #  - id: av
  #    name: A/V
  #    icon: tv
  #    items:
  #      # One key that turns a TV on OR off — `toggle` beats a pair of keys on
  #      # a surface where the device's real state is the thing you are trying
  #      # not to have to think about.
  #      - { name: TV Power, icon: tv, entity: media_player.lounge_tv, service: toggle }
  #      - name: TV Input
  #        icon: input
  #        sources: media_player.lounge_tv
  #        inputs:
  #          - HDMI 1
  #          - { source: HDMI 2, name: Laptop }
  #          - { source: HDMI 3, name: Mac Studio }
  #
  #  # ── A whole RoomOS device, as one tile ─────────────────────────────────
  #  #
  #  # `device:` is not a key. It is a Desk Pro or Room Bar rendered as a full
  #  # tile: the device's own meeting list, live occupancy and noise, the four
  #  # mute states, volume, share source, and call control.
  #  #
  #  # It is the one control here that is NOT fire-and-forget. A Companion key
  #  # can only report that the press was sent; this reads the device back, so
  #  # a mute key honestly shows that the mic IS muted. Where a device tile
  #  # covers something, it should REPLACE the Companion keys for it rather
  #  # than sit beside them.
  #  #
  #  # Needs github.com/Spencer8742/HomeAssistantCiscoRoomOS in Home Assistant.
  #  #
  #  # `prefix:` is the device's slug in Home Assistant and derives all 25
  #  # entity ids from it — sensor.desk_pro_ambient_noise,
  #  # switch.desk_pro_microphone_mute, button.desk_pro_join_next_meeting and
  #  # so on. Any slot may be written out to override the guess, or set to
  #  # `null` to drop it. A slot with no entity does not render, which is what
  #  # lets one tile describe a Room Kit Mini with no calendar and a Desk Pro
  #  # with one.
  #  - id: deskpro
  #    name: Desk Pro
  #    icon: phone
  #    items:
  #      - device:
  #          name: Desk Pro
  #          prefix: desk_pro
  #
  #          # Read:   standby noise people meetings uptime ip version alerts
  #          #         inCall sharing
  #          # Toggle: mic speaker dnd selfview
  #          # Set:    volume shareSource
  #          # Press:  wake sleep answer hangUp join refreshMeetings
  #          #         shareLocal shareToCall stopSharing
  #          #
  #          # Overriding one, and dropping one:
  #          # volume: number.desk_pro_speaker_volume
  #          # selfview: null
  #
  #      # Two things the integration does not expose, so the tile cannot:
  #      #
  #      #   CAMERA MUTE. It has `selfview`, which is the local preview, not
  #      #   the outgoing video. If a Companion key turns your camera off
  #      #   today, keep that key — like these two.
  #      #
  #      #   PER-MEETING JOIN. There is only `join_next_meeting`, so the tile
  #      #   puts Join on the next booking's row alone. A Join on the 12:00 row
  #      #   that started the 9:00 meeting is worse than no button.
  #      - { name: Camera On,  icon: camera,    companion: 1/2/1 }
  #      - { name: Camera Off, icon: cameraOff, companion: 1/2/0 }
