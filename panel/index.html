<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Matches Cisco's own Room Navigator sample app
      (cisco-ce/roomos-samples · navigator/navigator-webapp).
      No fixed width: the layout is fluid so it is correct at 1280x800 and
      1920x1080 alike. user-scalable=no kills pinch-zoom at the document
      level, which is safe because there is no zoomable content and no text
      input in normal operation.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090C" />

    <!-- RoomOS looks for apple-touch-icon FIRST when building the web app
         tile, then rel=icon. Must be between 60 and 1200 px or it is
         silently ignored. See docs/ROOMOS.md §9.

         180 px and square-cornered on purpose: that is the size iOS uses on
         every current iPhone and iPad, and iOS rounds the corners itself —
         an icon that is already rounded comes out as a rounded square inside
         a rounded square. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" href="/icon-192.png" type="image/png" />

    <!--
      Running on an iPad as a wall panel.

      Without these, "Add to Home Screen" produces a bookmark that opens in
      Safari with the address bar and tab strip around it — which is not a
      panel, and which Guided Access then locks you into. With them, the icon
      launches a standalone full-screen app.

      `black` rather than `black-translucent`: translucent draws the page
      UNDER the status bar, which needs safe-area padding throughout to stop
      the clock and battery sitting on top of the panel's own top row. `black`
      reserves that strip instead, so nothing is ever hidden. RoomOS ignores
      all three.

      The manifest deliberately has NO `start_url`. The panel's token and its
      `?panel=` id live in the URL — that is the whole design, because RoomOS
      erases storage nightly — and a `start_url` would replace that URL with a
      bare `/` every time the icon was tapped, launching a panel with no token
      and no identity. Omitting it makes the added URL the launch URL, query
      string and all. (The token is left in Safari's address bar on an
      iPhone or iPad for the same reason — see net/auth.ts — since the
      home-screen app does not share Safari's storage.)

      Push notifications need this too: iOS only offers Web Push to a web app
      launched from the home screen. See net/push.ts and public/sw.js.
    -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Home" />
    <!-- iOS turns anything that looks like a phone number — a temperature, a
         time, a volume — into a tappable link unless told not to. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>Home</title>

    <!--
      Critical shell styles, inlined. This paints the background and the
      loading state in the first frame, before the CSS file arrives — so a
      cold start never flashes white on a wall-mounted panel in a dark room.
      Keep this block tiny; everything else lives in styles/.
    -->
    <style>
      html {
        background: #08090c;
        color-scheme: dark;
      }
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #08090c;
        color: #f2f4f8;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #boot span {
        width: 2.5rem;
        height: 2.5rem;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-top-color: rgba(255, 255, 255, 0.65);
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot"><span></span></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
