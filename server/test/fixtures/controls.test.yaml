# Fixture for server/test/controls.test.mjs.
#
# The key lights' ports are the mock's, not 9123, which is the only reason the
# `host:port` form exists — real lights are all on 9123.

version: 1

ui:
  title: Controls Test
  timezone: UTC

home:
  scenes:
    - scene.movie_night

controls:
  keylights:
    - id: key_left
      name: Key Left
      host: 127.0.0.1:19201
    - id: key_right
      name: Key Right
      host: 127.0.0.1:19202

  # Off. The tests drive state explicitly; a background poll racing them would
  # make failures depend on timing rather than on behaviour.
  pollSeconds: 0

  pages:
    - id: deskpro
      name: Desk Pro
      icon: phone
      items:
        - id: deskpro.join
          name: Join
          icon: phone
          tone: accent
          wide: true
          companion: 1/0/0
        - id: deskpro.hangup
          name: Hang Up
          icon: phoneDown
          tone: danger
          companion: { page: 1, row: 0, column: 1 }
        # A location the mock Companion has no button at — a rearranged
        # Companion page, from this end.
        - id: deskpro.missing
          name: Gone
          companion: [9, 9, 9]

    - id: scenes
      name: Scenes
      icon: scene
      items:
        - id: scenes.movie
          name: Movie Night
          entity: scene.movie_night
        - id: scenes.listen
          name: Listen
          icon: mic
          webhook: office_voice_listen
        # Not on the dashboard anywhere else: proves a control entity is added
        # to the service allow-list by being written here.
        - id: scenes.goodnight
          name: Goodnight
          entity: script.goodnight

    - id: av
      name: A/V
      icon: tv
      items:
        # A media_player key that toggles — `toggle` had to be added to the
        # service allow-list for this, so the test is really about that.
        - id: av.power
          name: TV Power
          entity: media_player.tv
          service: toggle
        # Not a button: a picker of the entity's own source_list.
        - id: av.input
          name: TV Input
          sources: media_player.tv
        # Curated and renamed. `Live TV` is in the device's source_list but
        # not here, so it must be refused.
        - id: av.curated
          name: Box
          sources: media_player.tv
          inputs:
            - HDMI 1
            - { source: HDMI 2, name: Laptop }
        # Refused: sources only makes sense for a media_player.
        - id: av.bad
          name: Nope
          sources: light.living_room

    - id: desk
      name: Desk Tile
      items:
        - device:
            name: Test Desk Pro
            prefix: dp
            # Overrides the derived number.dp_volume.
            volume: number.dp_speaker_volume
            # Drops a slot the derivation would otherwise invent.
            selfview: null
            # Keys drawn in the tile's own toggle row — a Companion press
            # for something the integration does not expose. Deliberately NOT
            # a camera key: the integration exposes a camera mute now, so an
            # example using one would document the wrong thing.
            keys:
              - { id: desk.lights, name: Lights, companion: 1/0/1 }
              - { id: desk.blinds, name: Blinds, companion: 2/1/3 }
        # A device block naming nothing at all is not a device.
        - id: dp.empty
          device:
            name: Nothing

    - id: combo
      name: Combined
      items:
        # One key, two places. The Companion location exists in the mock; the
        # webhook is what proves the SECOND action ran.
        - id: combo.both
          name: Office Power
          actions:
            - { companion: 1/0/0 }
            - { webhook: combo_second }
        # The first action fails (no button at 9/9/9), so the second must not
        # run — a half-started room reported as a success is the failure this
        # guards.
        - id: combo.stops
          name: Stops Early
          actions:
            - { companion: 9/9/9 }
            - { webhook: combo_never }

    - id: lights
      name: Lights
      icon: bulb
      items:
        - id: lights.toggle
          name: Key Lights
          keylight: { light: all, op: toggle }
        - id: lights.dim
          name: Dim
          keylight: { light: key_left, op: brightness, value: 20 }
        - light: all
          name: Key Lights
