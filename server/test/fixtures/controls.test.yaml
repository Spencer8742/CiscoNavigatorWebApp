# Fixture for server/test/controls.test.mjs.
#
# The key lights' ports are the mock's, not 9123, which is the only reason the
# `host:port` form exists — real lights are all on 9123.

version: 1

ui:
  title: Controls Test
  timezone: UTC

home:
  scenes:
    - scene.movie_night

controls:
  tvs:
    - id: room_tv
      name: Room TV
      # Nothing listens here; these items exist to test PARSING.
      host: 127.0.0.1:19899
      inputs:
        - { source: HDMI_2, name: Laptop }
        - { source: HDMI_3, name: Mac Studio }

  keylights:
    - id: key_left
      name: Key Left
      host: 127.0.0.1:19201
    - id: key_right
      name: Key Right
      host: 127.0.0.1:19202

  # Off. The tests drive state explicitly; a background poll racing them would
  # make failures depend on timing rather than on behaviour.
  pollSeconds: 0

  pages:
    - id: deskpro
      name: Desk Pro
      icon: phone
      items:
        - id: deskpro.join
          name: Join
          icon: phone
          tone: accent
          wide: true
          webhook: deskpro_join
        - id: deskpro.hangup
          name: Hang Up
          icon: phoneDown
          tone: danger
          webhook: deskpro_hangup
        # A step that can only fail: no such key light.
        - id: deskpro.missing
          name: Gone
          keylight: { light: key_nowhere, op: toggle }
        # Companion support is gone. A key still carrying a Companion step is
        # dropped, and named in the log rather than silently lost.
        - id: deskpro.legacy
          name: Legacy
          companion: 1/0/0

    - id: scenes
      name: Scenes
      icon: scene
      items:
        - id: scenes.movie
          name: Movie Night
          entity: scene.movie_night
        - id: scenes.listen
          name: Listen
          icon: mic
          webhook: office_voice_listen
        # Not on the dashboard anywhere else: proves a control entity is added
        # to the service allow-list by being written here.
        - id: scenes.goodnight
          name: Goodnight
          entity: script.goodnight

    - id: av
      name: A/V
      icon: tv
      items:
        # A media_player key that toggles — `toggle` had to be added to the
        # service allow-list for this, so the test is really about that.
        - id: av.power
          name: TV Power
          entity: media_player.tv
          service: toggle
        # Not a button: a picker of the entity's own source_list.
        - id: av.input
          name: TV Input
          sources: media_player.tv
        # Curated and renamed. `Live TV` is in the device's source_list but
        # not here, so it must be refused.
        - id: av.curated
          name: Box
          sources: media_player.tv
          inputs:
            - HDMI 1
            - { source: HDMI 2, name: Laptop }
        # Refused: sources only makes sense for a media_player.
        - id: av.bad
          name: Nope
          sources: light.living_room

    - id: desk
      name: Desk Tile
      items:
        - device:
            name: Test Desk Pro
            prefix: dp
            # Overrides the derived number.dp_volume.
            volume: number.dp_speaker_volume
            # Drops a slot the derivation would otherwise invent.
            selfview: null
            # Keys drawn in the tile's own toggle row, for something the
            # integration does not expose.
            keys:
              - { id: desk.lights, name: Lights, webhook: desk_lights }
              - { id: desk.blinds, name: Blinds, webhook: desk_blinds }
        # A device block naming nothing at all is not a device.
        - id: dp.empty
          device:
            name: Nothing

    - id: combo
      name: Combined
      items:
        # One key, two places, with a pause between them.
        - id: combo.both
          name: Office Power
          actions:
            - { webhook: combo_first }
            - { wait: 0.2 }
            - { webhook: combo_second }
        # `on` and `off` are BOOLEANS in YAML 1.1. Written bare here on
        # purpose: quoting them would test the wrong thing.
        - id: combo.tvon
          name: TV On
          tv: room_tv
          action: on
        - id: combo.tvoff
          name: TV Off
          tv: room_tv
          action: off
        # The first action fails (no such light). The second must STILL run —
        # Shut Down should turn the lights off even when the Desk Pro is not
        # answering — and the failure must still reach the panel.
        - id: combo.carries
          name: Carries On
          actions:
            - { keylight: { light: key_nowhere, op: toggle } }
            - { webhook: combo_after }

    - id: lights
      name: Lights
      icon: bulb
      items:
        - id: lights.toggle
          name: Key Lights
          keylight: { light: all, op: toggle }
        - id: lights.dim
          name: Dim
          keylight: { light: key_left, op: brightness, value: 20 }
        - light: all
          name: Key Lights
