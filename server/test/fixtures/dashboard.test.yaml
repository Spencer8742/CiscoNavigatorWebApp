# Fixture for server/test/bridge.test.mjs.
#
# Deliberately references FEWER entities than the mock Home Assistant serves,
# so the tests can prove that unreferenced entities are filtered out of
# everything the panel sees and are refused by the service guard.

version: 1

ui:
  title: Test Panel
  timezone: UTC
  locale: en-GB

rooms:
  - id: living_room
    name: Living Room
    icon: sofa
    entities:
      # Bare id — the panel should fall back to HA's friendly_name.
      - light.living_room
      # Object form — this name must win over HA's friendly_name.
      - entity: cover.blinds
        name: Window Blinds
      - climate.thermostat
      # Duplicate of an earlier entry; must be dropped, not rendered twice.
      - light.living_room

home:
  favorites:
    - light.living_room
    - entity: lock.front_door
      name: Front Door Lock
  scenes:
    - scene.movie_night
  status:
    - entity: sensor.temperature
      label: Indoor
  alerts:
    - entity: lock.front_door
      when: unlocked
      label: Front door unlocked

media:
  players:
    - entity: media_player.speaker
      name: Speaker
